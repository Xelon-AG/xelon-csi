version: "2"

linters:
  default: none
  enable:
    - errcheck
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Xelon-AG/xelon-csi
        - github.com/Xelon-AG/xelon-sdk-go

output:
  formats:
    tab:
      path: stdout
      colors: false

run:
  timeout: 10m
